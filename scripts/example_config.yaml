port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: debug
proxies:
- name: test_proxy
  server: xxx.xxx.com
  port: xx
  type: ssr
  cipher: chacha20-ietf
  password: password
  protocol: auth_aes128_sha1
  obfs: plain
  protocol-param: xxxx:xxxx
  obfs-param: xxxxxxxxx.microsoft.com

proxy-groups:
- name: Proxy
  type: select
  proxies:
  - test_proxy

rules:
- MATCH,Proxy
